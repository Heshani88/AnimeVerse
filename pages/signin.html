<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AnimeVerse - Sign In</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="main-header">

    <div class="logo">
        <a href="../index.html">AnimeVerse</a>
    </div>

    <nav class="main-nav">
        <a href="../index.html">Home</a>
        <a href="anime.html">Anime</a>
        <a href="shows.html">Shows</a>
        <a href="manga.html">Manga</a>
        <a href="news.html">News</a>
        <a href="genres.html">Genres</a>
        <a href="about.html">About</a>
    </nav>

    <div class="header-actions">

        <a href="favorites.html" class="header-link">❤️</a>

        <a href="watchlist.html" class="header-link">📋</a>

        <a href="signin.html" class="signin-btn">
            Sign In
        </a>

        <a href="login.html" class="login-btn">
            Login
        </a>

        <button id="darkModeBtn" class="dark-mode-btn">
            🌙
        </button>

    </div>

</header>


<section class="hero">

    <h2>🔐 Sign In</h2>

    <p>Sign in to your AnimeVerse account.</p>

</section>


<section class="form-section">

    <div class="form-container">

        <h2>Welcome Back!</h2>

        <form id="signinForm">

            <label for="signinEmail">Email</label>

            <input
                type="email"
                id="signinEmail"
                placeholder="Enter your email"
                required
            >

            <label for="signinPassword">Password</label>

            <input
                type="password"
                id="signinPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="form-btn">
                Sign In
            </button>

        </form>

        <p id="signinMessage"></p>

        <p class="form-link">
            Don't have an account?
            <a href="login.html">Create one</a>
        </p>

    </div>

</section>


<footer>

    <p>© 2026 AnimeVerse. All Rights Reserved.</p>

</footer>


<script src="../script.js"></script>

</body>

</html>
