<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Details</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<header class="main-header">

    <div class="logo">
        <a href="../index.html">AnimeVerse</a>
    </div>

    <nav class="main-nav">

        <a href="../index.html">Home</a>
        <a href="anime.html">Anime</a>
        <a href="shows.html">Shows</a>
        <a href="manga.html">Manga</a>
        <a href="news.html">News</a>
        <a href="genres.html">Genres</a>
        <a href="about.html">About</a>

    </nav>

    <div class="header-actions">

        <a href="favorites.html" class="header-link">
            ❤️
        </a>

        <a href="watchlist.html" class="header-link">
            📋
        </a>

        <a href="signin.html" class="signin-btn">
            Sign In
        </a>

        <a href="login.html" class="login-btn">
            Login
        </a>

        <button id="darkModeBtn" class="dark-mode-btn">
            🌙
        </button>

    </div>

</header>

<div class="details-navigation">

    <a href="anime.html">
        <button class="nav-btn">← Back to Anime</button>
    </a>

    <div>
        <button id="prevAnime" class="nav-btn">
            ← Previous
        </button>

        <button id="nextAnime" class="nav-btn">
            Next →
        </button>
    </div>

</div>

<section class="details">

    <img id="animeImage" src="" alt="Anime">

    <div>
        <h2 id="animeTitle"></h2>

        <p><strong>Genre:</strong> <span id="animeGenre"></span></p>

        <p><strong>Episodes:</strong> <span id="animeEpisodes"></span></p>

        <p><strong>Rating:</strong> ⭐ <span id="animeRating"></span></p>

        <p id="animeDescription"></p>

        <div class="user-rating">

    <h3>⭐ Rate This Anime</h3>

    <div class="stars">
        <button class="star-btn" data-rating="1">⭐</button>
        <button class="star-btn" data-rating="2">⭐</button>
        <button class="star-btn" data-rating="3">⭐</button>
        <button class="star-btn" data-rating="4">⭐</button>
        <button class="star-btn" data-rating="5">⭐</button>
    </div>

    <p id="userRatingMessage">Select a rating</p>

</div>

        <button id="trailerBtn" class="trailer-btn">
        ▶️ Watch Trailer
        </button>

        <button id="watchBtn" class="watch-btn">
        🍿 Watch Now
        </button>

        <button id="favoriteBtn" class="favorite-btn">
        ❤️ Add to Favorites
        </button>

        <button id="watchlistBtn" class="watchlist-btn">
        ➕ Add to Watchlist
        </button>
    </div>

</section>

<section class="episodes-section">

    <h2> Episodes</h2>

    <div class="episodes" id="episodesList"></div>

</section>

<script src="../script.js"></script>

</body>

</html>
