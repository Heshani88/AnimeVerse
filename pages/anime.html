<!DOCTYPE html>
<html>
<head>
    <title>AnimeVerse - Anime</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="main-header">

    <div class="logo">
        <a href="../index.html">AnimeVerse</a>
    </div>

    <nav class="main-nav">

        <a href="../index.html">Home</a>

        <a href="anime.html">Anime</a>

        <a href="shows.html">Shows</a>

        <a href="manga.html">Manga</a>

        <a href="news.html">News</a>

        <a href="genres.html">Genres</a>

        <a href="about.html">About</a>

    </nav>

    <div class="header-actions">

        <a href="favorites.html" class="header-link">
            ❤️
        </a>

        <a href="watchlist.html" class="header-link">
            📋
        </a>

        <a href="signin.html" class="signin-btn">
            Sign In
        </a>

        <a href="login.html" class="login-btn">
            Login
        </a>

        <button id="darkModeBtn" class="dark-mode-btn">
            🌙
        </button>

    </div>

    </header>


    <!-- Hero Section -->
    <section class="hero">
        <h2>Anime Collection</h2>
        <p>Browse all your favorite anime.</p>
    </section>


    <!-- Search Section -->
    <section class="search-section">

        <input 
        type="text" 
        id="searchBox" 
        placeholder="Search anime..."
        >

        <select id="genreFilter">
            <option value="all">All Genres</option>
            <option value="action">Action</option>
            <option value="adventure">Adventure</option>
            <option value="fantasy">Fantasy</option>
            <option value="supernatural">Supernatural</option>
            <option value="thriller">Thriller</option>
        </select>

        <select id="sortAnime">
            <option value="default">Sort Anime</option>
            <option value="ratingHigh">⭐ Rating: High to Low</option>
            <option value="ratingLow">⭐ Rating: Low to High</option>
            <option value="nameAZ">🔤 Name: A to Z</option>
            <option value="nameZA">🔤 Name: Z to A</option>
        </select>

    </section>


    <!-- Anime Collection -->
    <section class="featured-section">

        <h2>All Anime</h2>
        <p>Explore our anime collection.</p>


        <div class="cards" id="animeList">
        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>© 2026 AnimeVerse. All Rights Reserved.</p>
    </footer>

    <script src="../script.js"></script>

</body>
</html>
